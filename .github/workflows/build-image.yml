# Etapa BUILD (reutilizável): constrói e publica a imagem no GHCR com tag imutável (sha).
name: Build da imagem

on:
  workflow_call:
    inputs:
      image: { type: string, required: true, description: "ex.: ghcr.io/tonybsilva-dev/offer" }
      scope: { type: string, required: true, description: "cache de build, ex.: offer-web" }
      build_args: { type: string, default: "" }
    outputs:
      image: { value: "${{ jobs.build.outputs.image }}" }
      tag: { value: "${{ jobs.build.outputs.tag }}" }

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ inputs.image }}
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: ${{ inputs.build_args }}
          tags: ${{ inputs.image }}:${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ inputs.scope }}
          cache-to: type=gha,scope=${{ inputs.scope }},mode=max
